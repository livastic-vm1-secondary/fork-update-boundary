name: VM1 MQ Trusted Push Probe

on:
  push:
    branches:
      - 'mergify/merge-queue/**'

permissions:
  contents: write

jobs:
  trusted-push:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VM1_MQ_SENTINEL: ${{ secrets.VM1_MQ_SENTINEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute repository probe
        run: bash ci/vm1-mq-probe.sh
