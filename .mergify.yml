pull_request_rules:
  - name: VM1 WA queue action while Merge Queue product is disabled
    conditions:
      - title = VM1_MQOFF_WA_QUEUE_260922
    actions:
      queue:
        name: vm1-mqoff-wa

queue_rules:
  - name: vm1-mqoff-wa
    queue_conditions:
      - title = VM1_MQOFF_WA_QUEUE_260922
    merge_conditions:
      - title = VM1_MQOFF_WA_QUEUE_260922

merge_queue:
  mode: serial
  max_parallel_checks: 1
