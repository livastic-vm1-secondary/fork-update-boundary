merge_queue:
  max_parallel_checks: 2
queue_rules:
  - name: vm1-mq-trusted-push-readonly
    batch_size: 1
    batch_max_wait_time: 1 min
    max_checks_retries: 1
    queue_conditions:
      - title = VM1_MQ_TRUSTED_PUSH_READONLY_260923
    merge_conditions:
      - check-success = vm1-mq-never
    merge_method: squash
    autoqueue: true
pull_request_rules:
  - name: VM1 closed-at reopen freshness 260930
    conditions:
      - title = VM1_CLOSEDAT_REOPEN_260930
      - -closed
      - closed-at < 2100-01-01
    actions:
      label:
        add:
          - vm1-closedat-stale-260930
