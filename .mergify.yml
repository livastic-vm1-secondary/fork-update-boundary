merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm1-native-stack-order
    batch_size: 1
    max_checks_retries: 0
    merge_method: merge
    update_method: merge
    queue_conditions:
      - title ~= ^VM1_NATIVE_STACK_[AB]_260922$
    merge_conditions:
      - check-success = VM1_NATIVE_STACK_NEVER_260922

pull_request_rules:
  - name: AUTO_UPDATE_FORK_BOUNDARY
    conditions:
      - base = main
      - "#commits-behind > 0"
    actions:
      update:
