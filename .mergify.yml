merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm1-pause-midflight
    batch_size: 1
    max_checks_retries: 0
    merge_method: merge
    update_method: merge
    queue_conditions:
      - base = vm1-pause-base-260922
      - title = VM1_PAUSE_MIDFLIGHT_260922
    merge_conditions:
      - label = vm1-pause-go-260922

pull_request_rules:
  - name: AUTO_UPDATE_FORK_BOUNDARY
    conditions:
      - base = main
      - "#commits-behind > 0"
    actions:
      update:
