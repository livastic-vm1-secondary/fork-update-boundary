pull_request_rules:
  - name: AUTO_UPDATE_FORK_BOUNDARY
    conditions:
      - base = main
      - "#commits-behind > 0"
    actions:
      update:

  - name: VM1 github_actions same-repo dispatch baseline
    conditions:
      - title = VM1_GHA_SAME_REPO_BASELINE_260923
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: vm1-gha-source-sentinel.yml

  - name: VM1 github_actions sibling repository path traversal
    conditions:
      - title = VM1_GHA_XREPO_TRAVERSAL_260923
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: "../../../team-command-boundary/actions/workflows/vm1-gha-target-sentinel.yml"
